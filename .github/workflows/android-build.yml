name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

# Avoid piling up redundant runs on rapid pushes to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests (includes Room/DB tests under src/test)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode release keystore (if configured)
        env:
          ERP_RELEASE_KEYSTORE_BASE64: ${{ secrets.ERP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ERP_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$ERP_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ERP_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; assembleRelease will produce an unsigned APK."
          fi

      - name: Assemble release APK
        env:
          ERP_RELEASE_KEYSTORE: ${{ env.ERP_RELEASE_KEYSTORE }}
          ERP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ERP_RELEASE_KEYSTORE_PASSWORD }}
          ERP_RELEASE_KEY_ALIAS: ${{ secrets.ERP_RELEASE_KEY_ALIAS }}
          ERP_RELEASE_KEY_PASSWORD: ${{ secrets.ERP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineERP-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineERP-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
