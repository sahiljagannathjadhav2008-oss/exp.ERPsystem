name: offline_erp
description: Offline-first Indian SME ERP - accounting, inventory, sales, purchase, GST, banking, payroll and reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true